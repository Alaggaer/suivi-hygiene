# Mise en ligne automatique sur GitHub Pages (phase de test) à chaque envoi sur main : tests, construction, publication.
name: Mise en ligne
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Tests (une version qui échoue aux tests n'est pas mise en ligne)
        run: npm test
      - name: Construction
        run: npm run build
        env:
          # Clé publique Supabase : faite pour être visible, la sécurité est assurée par les règles de la base.
          VITE_SUPABASE_URL: https://ldsxlovhueuzmhrzofjo.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_GievyKFgGPH8Ja6hmVmnGw_w4aUx1t5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
