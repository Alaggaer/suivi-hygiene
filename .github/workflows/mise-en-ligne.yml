# Mise en ligne automatique sur GitHub Pages à chaque envoi sur main : tests (base, parcours, unitaires), construction, publication.
# Si un seul test échoue, la version en ligne reste l'ancienne.
name: Mise en ligne
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Règles de la base (sécurité, calculs, historique) testées sur un PostgreSQL jetable.
  tests-base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16
        run: sudo apt-get install -y -qq postgresql-16 postgresql-contrib-16 >/dev/null
      - name: Migrations et tests SQL
        shell: bash   # avec pipefail : un échec n'est pas masqué par le filtre
        run: sudo bash supabase/tests/run.sh 2>&1 | grep -v NOTICE

  # Parcours complets sur tablette et siège, dans un vrai navigateur (serveur simulé).
  tests-parcours:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Navigateur de test
        run: |
          pip install -q pytest playwright openpyxl
          python3 -m playwright install --with-deps chromium >/dev/null
      - name: Parcours
        run: npm run test:e2e

  construire:
    needs: [tests-base, tests-parcours]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Tests (une version qui échoue aux tests n'est pas mise en ligne)
        run: npm test
      - name: Construction
        run: npm run build
        env:
          # Clé publique Supabase : faite pour être visible, la sécurité est assurée par les règles de la base.
          VITE_SUPABASE_URL: https://ldsxlovhueuzmhrzofjo.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_GievyKFgGPH8Ja6hmVmnGw_w4aUx1t5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
